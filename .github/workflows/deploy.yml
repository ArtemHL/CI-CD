name: Deploy pingpong
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start server and run tests
        run: |
          node server.js &
          sleep 1
          node test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: artemhl/pingpong:${{ github.sha }}

      - uses: actions/checkout@v4
        with:
          ref: deploy
          path: deploy-branch

      - name: Publish manifests to the deploy branch
        run: |
          rm -rf deploy-branch/k8s
          cp -r k8s deploy-branch/k8s
          sed -i "s|image: artemhl/pingpong:.*|image: artemhl/pingpong:${{ github.sha }}|" deploy-branch/k8s/deployment.yaml
          cd deploy-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "deploy: pingpong ${{ github.sha }}"
          git pull --rebase
          git push