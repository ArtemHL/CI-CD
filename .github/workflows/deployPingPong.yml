name: Deploy pingpong
on:
  push:
    branches: [main]
    paths:
      - 'apps/pingpong/**'
      - 'charts/webapp/**'
      - '.github/workflows/deployPingPong.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start server and run tests
        run: |
          node apps/pingpong/server.js &
          sleep 1
          node apps/pingpong/test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/pingpong
          push: true
          tags: artemhl/pingpong:${{ github.sha }}

      - uses: 
          actions/checkout@v4
        with:
          ref: deploy
          path: deploy-branch

      - name: Publish chart, values and tag to the deploy branch
        run: |
          mkdir -p deploy-branch/pingpong
          rm -rf deploy-branch/charts
          cp -r charts deploy-branch/charts
          cp apps/pingpong/values.yaml deploy-branch/pingpong/values.yaml
          touch deploy-branch/pingpong/tag.yaml
          yq -i '.image.tag = "${{ github.sha }}"' deploy-branch/pingpong/tag.yaml
          cd deploy-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "deploy: pingpong ${{ github.sha }}"
          git pull --rebase
          git push