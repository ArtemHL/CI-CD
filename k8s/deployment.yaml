apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
      - name: pingpong
        image: artemhl/pingpong:4bdc904bff7be33ba67ea4c4ec32a0649ba9e166
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5