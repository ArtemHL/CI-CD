apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
      - name: pingpong
        image: artemhl/pingpong:585a5d3e80c73ad55d19b62b82099de03634d0c7
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5